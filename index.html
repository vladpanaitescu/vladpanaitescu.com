<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vlad Panaitescu | Official Website</title>
  <meta name="description" content="Portofoliu de design grafic — branding, UI/UX, ilustrație și motion graphics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

  <!-- ===== LOADER ===== -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
  </div>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#projects" data-i18n="nav.projects">PROIECTE</a></li>
        <li><a href="/carspotting/" data-i18n="nav.carspotting">CAR SPOTTING</a></li>
        <li><a href="#contact" data-i18n="nav.contact">CONTACT</a></li>
      </ul>
      <div class="nav-actions">
        <div class="lang-switcher" id="langSwitcher">
          <button class="lang-btn" id="langBtn" aria-label="Schimbă limba">
            <span id="currentLangFlag">🇷🇴</span>
            <span id="currentLangCode">RO</span>
          </button>
          <div class="lang-dropdown" id="langDropdown">
            <button class="lang-option" data-lang="ro"><span>🇷🇴</span> Română</button>
            <button class="lang-option" data-lang="en"><span>🇬🇧</span> English</button>
            <button class="lang-option" data-lang="de"><span>🇩🇪</span> Deutsch</button>
            <button class="lang-option" data-lang="it"><span>🇮🇹</span> Italiano</button>
            <button class="lang-option" data-lang="fr"><span>🇫🇷</span> Français</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== HERO ===== -->
  <section class="hero" id="hero">
    <div class="hero-avatar-zone">
      <div class="avatar-container" id="avatarContainer">
        <div class="avatar-3d" id="avatar3d">
          <img src="/assets/avatar.png" alt="Vlad Panaitescu 3D Avatar" class="avatar-img" id="avatarImg" />
        </div>
      </div>
    </div>
    <div class="hero-inner">
      <div class="hero-text-zone">
        <h1 class="hero-mega-title-line">
          <span data-i18n="hero.greeting">BINE AI VENIT</span><span class="accent-dot">.</span>
        </h1>
      </div>
    </div>
    <div class="hero-bottom-row">
      <p class="hero-tagline">Imagine · Create · Assess · Repeat</p>
      <a href="#contact" class="btn-contact" data-i18n="hero.cta">CONTACTEAZĂ-MĂ</a>
    </div>
  </section>

  <!-- ===== PROJECTS GRID ===== -->
  <section class="projects-section" id="projects">
    <div class="projects-grid" id="projectsGrid">
      <!-- Injected by JS -->
    </div>
  </section>

  <!-- ===== PROJECT DETAIL OVERLAY ===== -->
  <div class="project-overlay" id="projectOverlay">
    <div class="project-overlay-backdrop" id="projectOverlayBackdrop"></div>
    <div class="project-overlay-container" id="projectOverlayContainer">
      <button class="project-overlay-close" id="projectOverlayClose" aria-label="Close">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
      <div class="project-overlay-content" id="projectOverlayContent">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- ===== CONTACT ===== -->
  <section class="contact" id="contact">
    <div class="section-container">
      <div class="contact-inner">
        <h2 class="section-mega-title" data-i18n="contact.title">CONTACT</h2>
        <p class="contact-description" data-i18n="contact.description">Ai un proiect în minte? Hai să discutăm!</p>
        <a href="tel:+40735163303" class="contact-phone-number">+40 735 163 303</a>
        <div class="contact-actions">
          <a href="tel:+40735163303" class="btn-contact btn-contact-action" id="btnCall">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span data-i18n="contact.call">SUNĂ-MĂ</span>
          </a>
          <a href="https://wa.me/40735163303" target="_blank" rel="noopener" class="btn-contact btn-contact-action btn-whatsapp" id="btnWhatsapp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            <span>WHATSAPP</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="section-container">
      <div class="footer-content">
        <span class="footer-logo">VP</span>
        <p class="footer-copy">© 2026 Vlad Panaitescu. <span data-i18n="footer.rights">Toate drepturile
            rezervate.</span></p>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
